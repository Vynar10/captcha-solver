[package]
name = "captcha-solver"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
image = "0.25.10"
reqwest = { version = "0.13.5", features = ["json", "blocking", "cookies"] }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
