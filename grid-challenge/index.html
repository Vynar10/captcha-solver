<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grid challenge</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 2rem auto; padding: 0 1rem; }
    #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 1rem 0; }
    #grid img { width: 100%; cursor: pointer; border: 4px solid transparent; border-radius: 4px; }
    #grid img.on { border-color: #2a7de1; }
    button { font: inherit; padding: .4rem .9rem; margin-right: .4rem; }
    #result { margin-top: 1rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Select every <span id="prompt">…</span></h1>
  <div id="grid"></div>
  <button id="submit">Submit</button>
  <button id="next">New challenge</button>
  <div id="result"></div>

  <script>
    let current = null;
    const grid = document.getElementById("grid");
    const result = document.getElementById("result");

    async function load() {
      current = await (await fetch("/api/challenge")).json();
      document.getElementById("prompt").textContent = current.prompt;
      result.textContent = "";
      grid.innerHTML = "";
      current.images.forEach((b64, i) => {
        const img = document.createElement("img");
        img.src = "data:image/png;base64," + b64;
        img.dataset.index = i;
        img.onclick = () => img.classList.toggle("on");
        grid.appendChild(img);
      });
    }

    document.getElementById("submit").onclick = async () => {
      const selected = [...grid.querySelectorAll("img.on")].map(img => +img.dataset.index);
      const res = await fetch("/api/answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: current.id, selected }),
      });
      const body = await res.json();
      result.textContent = body.error ?? (body.correct ? "Correct" : `Wrong, expected ${body.expected}`);
    };
    document.getElementById("next").onclick = load;
    load();
  </script>
</body>
</html>
